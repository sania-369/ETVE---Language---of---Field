<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ETVP Si-Photon Core X — 3D визуализация</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a1a; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #aac;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #334;
            z-index: 10;
        }
        #info h1 {
            margin: 0;
            font-size: 18px;
            color: #fff;
            letter-spacing: 1px;
        }
        #info span {
            color: #6af;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ccc;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid #334;
            pointer-events: none;
            z-index: 10;
        }
        #legend div { margin: 3px 0; display: flex; align-items: center; gap: 10px; }
        .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
        .dot.blue { background: #3a86ff; }
        .dot.red { background: #ff006e; }
        .dot.green { background: #06d6a0; }
        .dot.gold { background: #ffbe0b; }
        .dot.orange { background: #fb5607; }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="info">
    <h1>🌀 ETVP Si-Photon Core X</h1>
    <span>256 колец · JPA · MEMS · Спираль памяти</span>
</div>

<div id="legend">
    <div><span class="dot blue"></span> Кольца Si₃N₄ (слой 0)</div>
    <div><span class="dot red"></span> pn-переходы (слой 1)</div>
    <div><span class="dot green"></span> JPA-массив (слой 2)</div>
    <div><span class="dot gold"></span> Спираль памяти (слой 3)</div>
    <div><span class="dot orange"></span> MEMS-переключатель</div>
</div>

<div id="controls">🖱 Вращение · Прокрутка для масштаба</div>

<!-- Подключаем Three.js и OrbitControls через CDN -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- ИНИЦИАЛИЗАЦИЯ ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(600, 500, 800);
camera.lookAt(500, 0, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- УПРАВЛЕНИЕ ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(500, 0, 500);
controls.enableZoom = true;
controls.maxPolarAngle = Math.PI / 2;

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0x404060);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(200, 400, 300);
scene.add(dirLight);

const backLight = new THREE.DirectionalLight(0x4466ff, 0.5);
backLight.position.set(-200, 100, -300);
scene.add(backLight);

// --- ВСПОМОГАТЕЛЬНАЯ СЕТКА (пол) ---
const gridHelper = new THREE.GridHelper(1100, 20, 0x3366aa, 0x224488);
gridHelper.position.y = -5;
scene.add(gridHelper);

// --- ГЕНЕРАЦИЯ ГЕОМЕТРИИ ---
const PHI = (1 + Math.sqrt(5)) / 2;
const NUM_RINGS = 256;

// Материалы
const ringMat = new THREE.MeshPhongMaterial({ color: 0x3a86ff, emissive: 0x0a1a3a, transparent: true, opacity: 0.25, wireframe: false });
const ringEdgeMat = new THREE.LineBasicMaterial({ color: 0x3a86ff, transparent: true, opacity: 0.2 });

const pnMat = new THREE.PointsMaterial({ color: 0xff006e, size: 1.5, transparent: true, opacity: 0.5 });

const jpaMat = new THREE.MeshPhongMaterial({ color: 0x06d6a0, emissive: 0x004433, transparent: true, opacity: 0.8 });

const spiralMat = new THREE.LineBasicMaterial({ color: 0xffbe0b });
const memsMat = new THREE.MeshPhongMaterial({ color: 0xfb5607, emissive: 0x552200 });

// --- 1. КОЛЬЦА (слой 0) ---
const ringGroup = new THREE.Group();
const pnPositions = [];

for (let i = 0; i < NUM_RINGS; i++) {
    const R = 10 * Math.pow(PHI, i / 16);
    const theta = i * 0.05;
    const x = 500 + 15 * i * Math.cos(theta);
    const z = 500 + 15 * i * Math.sin(theta); // в Three.js Y — вверх, Z — глубина

    // Круг (кольцо) как тонкий тор
    const torus = new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.5, 12, 32),
        ringMat
    );
    torus.position.set(x, 0, z);
    torus.rotation.x = Math.PI / 2;
    ringGroup.add(torus);

    // pn-переходы (слой 1) — точки на кольце
    pnPositions.push(x, 1.5, z);

    // Добавляем маленькие точки на кольце для красоты
    const dotMat = new THREE.PointsMaterial({ color: 0x3a86ff, size: 0.8 });
    const dotGeo = new THREE.BufferGeometry();
    const dotPos = [];
    for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2;
        dotPos.push(x + R * Math.cos(a), 0, z + R * Math.sin(a));
    }
    dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPos, 3));
    const dotPoints = new THREE.Points(dotGeo, dotMat);
    ringGroup.add(dotPoints);
}
scene.add(ringGroup);

// --- 2. pn-ПЕРЕХОДЫ (слой 1) как точки ---
const pnGeo = new THREE.BufferGeometry();
pnGeo.setAttribute('position', new THREE.Float32BufferAttribute(pnPositions, 3));
const pnPoints = new THREE.Points(pnGeo, pnMat);
scene.add(pnPoints);

// --- 3. JPA-МАССИВ (слой 2) ---
const jpaGroup = new THREE.Group();
for (let j = 0; j < 8; j++) {
    for (let k = 0; k < 8; k++) {
        const x = 100 + j * 80;
        const z = 100 + k * 80;
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(4, 2, 4),
            jpaMat
        );
        cube.position.set(x, 3, z);
        jpaGroup.add(cube);

        // Маленькая сфера в центре JPA
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 8, 8),
            new THREE.MeshPhongMaterial({ color: 0x06d6a0, emissive: 0x003322 })
        );
        sphere.position.set(x, 3, z);
        jpaGroup.add(sphere);
    }
}
scene.add(jpaGroup);

// --- 4. СПИРАЛЬ ПАМЯТИ (слой 3) ---
const spiralPoints = [];
const steps = 600;
for (let i = 0; i < steps; i++) {
    const t = i / steps * 30 * Math.PI;
    const r = 5 + t * 0.08;
    const x = 800 + r * Math.cos(t);
    const z = 800 + r * Math.sin(t);
    spiralPoints.push(new THREE.Vector3(x, 4.5, z));
}
const spiralGeo = new THREE.BufferGeometry().setFromPoints(spiralPoints);
const spiralLine = new THREE.Line(spiralGeo, spiralMat);
scene.add(spiralLine);

// --- 5. MEMS-ПЕРЕКЛЮЧАТЕЛЬ (слой 3) ---
const memsGroup = new THREE.Group();

// Кантилеввер (брус)
const beam = new THREE.Mesh(
    new THREE.BoxGeometry(30, 1, 4),
    memsMat
);
beam.position.set(800, 5, 800);
memsGroup.add(beam);

// Опорный столбик
const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(2, 2, 3, 8),
    new THREE.MeshPhongMaterial({ color: 0x888888 })
);
pillar.position.set(785, 2.5, 800);
memsGroup.add(pillar);

// Красная точка на конце
const tip = new THREE.Mesh(
    new THREE.SphereGeometry(2, 8, 8),
    new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x660000 })
);
tip.position.set(815, 5.5, 800);
memsGroup.add(tip);

scene.add(memsGroup);

// --- 6. ДЕКОРАТИВНЫЕ ЛИНИИ СВЯЗИ ---
const lineMat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.1 });
for (let i = 0; i < 30; i++) {
    const p1 = new THREE.Vector3(100 + Math.random() * 800, Math.random() * 5, 100 + Math.random() * 800);
    const p2 = new THREE.Vector3(100 + Math.random() * 800, Math.random() * 5, 100 + Math.random() * 800);
    const lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
    const line = new THREE.Line(lineGeo, lineMat);
    scene.add(line);
}

// --- АНИМАЦИЯ ---
function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // Лёгкая анимация: JPA пульсируют
    const time = Date.now() * 0.001;
    jpaGroup.children.forEach((child, idx) => {
        if (child.type === 'Mesh' && child.geometry.type === 'SphereGeometry') {
            const scale = 1 + 0.1 * Math.sin(time * 0.5 + idx);
            child.scale.set(scale, scale, scale);
        }
    });

    renderer.render(scene, camera);
}

animate();

// --- АДАПТАЦИЯ К РАЗМЕРУ ОКНА ---
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
  </html>
