<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌀 Дыхание Бесконечности (ЕТВП)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background-color: #030208;
            color: white;
            user-select: none;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 5, 20, 0.5);
            backdrop-filter: blur(6px);
            padding: 14px 30px;
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            font-size: 15px;
            letter-spacing: 1px;
            color: #ddcba4;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        #info span {
            color: #f5d742;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            #info { font-size: 11px; padding: 10px 16px; white-space: normal; width: 90%; }
        }
        #status {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(10, 5, 20, 0.35);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-size: 13px;
            color: #bbaa88;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        #status strong {
            color: #f5d742;
        }
    </style>
</head>
<body>
    <div id="status">🌀 Когерентность <strong id="cohDisplay">0.95</strong></div>
    <div id="info">🪷 Вглядись в пульсацию Бесконечности · Золотое сечение формирует реальность</div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Константы поля ---
        const PHI = 1.61803398875;
        let coherence = 0.85;
        let timeAccum = 0;
        const dt = 0.015;

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030208);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(12, 6, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0x332233);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xf5d742, 0.8, 30);
        pointLight.position.set(4, 8, 6);
        scene.add(pointLight);
        const backLight = new THREE.PointLight(0x4466aa, 0.4, 40);
        backLight.position.set(-6, -2, -10);
        scene.add(backLight);

        // --- Главный солитон (золотая сфера-вихрь) ---
        const particleCount = 2800;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const basePositions = new Float32Array(particleCount * 3);
        const phases = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            // Случайные начальные параметры для каждой частицы
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 0.5 + Math.random() * 0.5; // радиус внутри сферы
            basePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            basePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            basePositions[i*3+2] = r * Math.cos(phi);
            phases[i] = Math.random() * Math.PI * 2;
            sizes[i] = 0.08 + Math.random() * 0.2;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Текстура точки (круг с мягким свечением)
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,240,200,0.9)');
        gradient.addColorStop(1, 'rgba(255,200,100,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const dotTexture = new THREE.CanvasTexture(canvas);

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.25,
            map: dotTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.95,
        });

        const particleSystem = new THREE.Points(geometry, particleMaterial);
        scene.add(particleSystem);

        // --- Внутреннее свечение (золотой шар) ---
        const glowGeo = new THREE.SphereGeometry(1.8, 48, 48);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xf5d742,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
        });
        const glowSphere = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glowSphere);

        // --- Внешняя туманность (дышащие сферы) ---
        const fogParticlesCount = 600;
        const fogGeo = new THREE.BufferGeometry();
        const fogPos = new Float32Array(fogParticlesCount * 3);
        for (let i = 0; i < fogParticlesCount; i++) {
            const r = 6 + Math.random() * 14;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            fogPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            fogPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
            fogPos[i*3+2] = r * Math.cos(phi);
        }
        fogGeo.setAttribute('position', new THREE.BufferAttribute(fogPos, 3));
        const fogMat = new THREE.PointsMaterial({
            color: 0x665533,
            size: 0.4,
            transparent: true,
            opacity: 0.06,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const fogSystem = new THREE.Points(fogGeo, fogMat);
        scene.add(fogSystem);

        // --- UI ---
        const cohSpan = document.getElementById('cohDisplay');

        // --- Анимация (дыхание поля) ---
        function animate() {
            requestAnimationFrame(animate);
            timeAccum += dt;
            // 1. Динамика когерентности (автоколебания)
            const fieldDrive = Math.sin(timeAccum * PHI * 0.5) * 0.5 + 0.5;
            const orderTerm = PHI * fieldDrive * (1.0 - coherence);
            const chaosTerm = Math.abs(Math.cos(timeAccum * 0.7)) * 0.3 * coherence;
            let dC = orderTerm - chaosTerm;
            coherence += dC * dt;
            coherence = Math.min(0.99, Math.max(0.45, coherence));

            // 2. Обновление UI
            cohSpan.textContent = coherence.toFixed(3);

            // 3. Масштаб пульсации
            const breath = 1.0 + 0.12 * Math.sin(timeAccum * 0.6);
            const scale = 5.5 * coherence * breath;

            // 4. Обновление частиц
            const posAttr = particleSystem.geometry.attributes.position;
            const colAttr = particleSystem.geometry.attributes.color;
            const posArray = posAttr.array;
            const colArray = colAttr.array;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const phaseOffset = phases[i] + timeAccum * 0.5;
                const rBase = 0.6 + 0.4 * Math.sin(phaseOffset * 0.7 + timeAccum * 0.2);
                
                // Сферическая спираль
                const theta = phaseOffset + timeAccum * PHI * 0.3;
                const phi = phaseOffset * 0.8 + timeAccum * 0.25;
                const r = scale * rBase * (0.8 + 0.2 * Math.sin(timeAccum * 0.4 + i));
                
                const x = r * Math.sin(theta) * Math.cos(phi);
                const y = r * Math.sin(theta) * Math.sin(phi) * 0.7;
                const z = r * Math.cos(theta) * 0.9;
                
                posArray[i3] = x;
                posArray[i3+1] = y;
                posArray[i3+2] = z;

                // Цвет: золото → белый
                const warmth = 0.08 + 0.05 * Math.sin(phaseOffset);
                const hue = 0.10 + warmth * (1.0 - coherence * 0.2);
                const sat = 0.3 + 0.5 * coherence;
                const light = 0.4 + 0.5 * coherence * (0.8 + 0.2 * Math.sin(timeAccum + i));
                const color = new THREE.Color().setHSL(hue, sat, light);
                colArray[i3] = color.r;
                colArray[i3+1] = color.g;
                colArray[i3+2] = color.b;
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            // 5. Дыхание центрального свечения
            glowSphere.scale.setScalar(1.0 + (1.0 - coherence) * 1.8);
            glowSphere.material.opacity = 0.05 + 0.12 * coherence;

            // 6. Пульсация внешней туманности
            fogSystem.rotation.y = timeAccum * 0.008;
            fogSystem.rotation.x = Math.sin(timeAccum * 0.005) * 0.1;
            fogMat.opacity = 0.04 + 0.04 * coherence;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Адаптация ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
